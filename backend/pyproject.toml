[project]
name = "relay-commerce"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["Django==5.2.17", "cryptography>=50,<51", "httpx>=0.28,<1", "psycopg[binary]>=3.2,<4", "gunicorn>=23,<24", "whitenoise>=6.9,<7"]

[dependency-groups]
dev = ["ruff>=0.13", "pip-audit>=2.9"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
