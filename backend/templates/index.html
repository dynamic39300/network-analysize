{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="NetCare 帮你分清 Mac 本地网络、VPN、代理、DNS 与目标服务问题。基础诊断永久免费，诊断数据默认留在本机。">
  <title>NetCare · 看清连接的每一层</title>
  <link rel="icon" href="{% static 'relay-logo.png' %}" type="image/png">
  <link rel="stylesheet" href="{% static 'relay.css' %}">
  <script src="{% static 'theme.js' %}"></script>
  <script src="{% static 'vendor/qrcode.js' %}" defer></script>
  <script src="{% static 'app.js' %}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="NetCare 首页"><img src="{% static 'relay-logo.png' %}" width="34" height="34" alt=""><span>NetCare</span></a>
      <button id="nav-toggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="展开导航">菜单</button>
      <nav id="site-nav" class="site-nav" aria-label="主导航">
        <a href="/features/" data-nav="/features/">功能</a><a href="/pricing/" data-nav="/pricing/">价格</a><a href="/download/" data-nav="/download/">下载</a><a href="/support/" data-nav="/support/">支持</a>
        <a href="/login/" id="nav-account" class="nav-account">登录账号</a>
      </nav>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换外观">外观</button>
    </div>
  </header>
  <div id="environment-notice" class="environment-notice" role="status" hidden></div>
  <main id="main" tabindex="-1"><div class="page-width page-loading" aria-live="polite"><div class="skeleton-heading"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div><p>正在准备 NetCare…</p></div></main>
  <noscript><div class="page-width notice">NetCare 官网的账号与购买流程需要 JavaScript。基础网络诊断可直接在 NetCare Mac 客户端运行。</div></noscript>
  <footer class="site-footer page-width">
    <div class="footer-top"><a class="brand" href="/"><img src="{% static 'relay-logo.png' %}" width="30" height="30" alt=""><span>NetCare</span></a><p>看清连接的每一层。</p></div>
    <div class="footer-bottom"><span>© <span id="copyright-year">2026</span> NetCare</span><nav aria-label="页脚导航"><a href="/privacy/">隐私说明</a><a href="/terms/">服务条款</a><a href="/support/">联系支持</a></nav></div>
  </footer>
  <dialog id="action-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
