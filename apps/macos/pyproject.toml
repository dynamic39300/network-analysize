[project]
name = "relay-macos"
version = "3.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "rumps==0.4.0; sys_platform == 'darwin'",
  "pyobjc-core>=11.1,<12; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=11.1,<12; sys_platform == 'darwin'",
  "pyobjc-framework-SystemConfiguration>=11.1,<12; sys_platform == 'darwin'",
  "pyobjc-framework-ServiceManagement>=11.1,<12; sys_platform == 'darwin'",
  "cryptography>=50.0.1,<51",
  "keyring>=25.6,<26",
  "jsonschema>=4.25,<5",
]

[dependency-groups]
dev = ["pyinstaller>=6,<7", "ruff>=0.13", "pip-audit>=2.9"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
