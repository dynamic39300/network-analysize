user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  client_max_body_size 64k;
  # Do not log query strings (desktop request IDs) or request/response bodies.
  log_format relay '$remote_addr $request_method $uri $status $body_bytes_sent';
  access_log /dev/stdout relay;
  error_log /dev/stderr warn;
  server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /run/relay-tls/fullchain.pem;
    ssl_certificate_key /run/relay-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
      proxy_pass http://127.0.0.1:8016;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header Forwarded "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 50s;
    }
  }
}
