name: relay-commercial
services:
  web:
    image: relay-commercial:${RELAY_IMAGE_TAG:?Set an immutable release tag}
    build:
      context: ../..
      dockerfile: deploy/commercial/Dockerfile
      args:
        PYTHON_IMAGE: ${RELAY_PYTHON_IMAGE:-python:3.12-slim-bookworm}
        UV_IMAGE: ${RELAY_UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.5}
    env_file:
      - ${RELAY_ENV_FILE:?Set an absolute external production env file}
    ports:
      - ${RELAY_HTTPS_BIND:-127.0.0.1:8443}:443
    environment:
      RELAY_ENV: production
      RELAY_RUNTIME_DIR: /var/lib/relay
      DATABASE_SSLMODE: verify-full
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_USE_TLS: "1"
      SIMULATED_PAYMENTS: "0"
      TRUST_PROXY_HTTPS: "1"
      TRUSTED_PROXY_IPS: 127.0.0.1
      PGSSLROOTCERT: /run/relay-secrets/postgres-ca.pem
    volumes:
      - runtime:/var/lib/relay
      - type: bind
        source: ${RELAY_SECRETS_DIR:?Set absolute external secrets directory}
        target: /run/relay-secrets
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; from urllib.parse import urlsplit; r=urllib.request.Request('http://127.0.0.1:8016/readyz',headers={'Host':urlsplit(os.environ['PUBLIC_URL']).netloc,'X-Forwarded-Proto':'https'}); assert urllib.request.urlopen(r,timeout=4).status==200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  proxy:
    image: ${RELAY_PROXY_IMAGE:-nginx:stable-alpine}
    # Share only the app network namespace so the last hop is exactly loopback.
    network_mode: service:web
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${RELAY_TLS_DIR:?Set external TLS certificate directory}:/run/relay-tls:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=1m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE,SETUID,SETGID,CHOWN]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  runtime:
networks:
  backend:
